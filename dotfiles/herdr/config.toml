onboarding = false
# herdr "zero chrome" layout: sidebar hidden, tab bar hidden while a single
# tab is open, no pane borders or gaps.
#
# `theme.name = "terminal"` selects the one built-in palette that emits plain
# ANSI slots instead of hardcoded RGB, so herdr inherits whatever palette
# Alacritty is currently importing and follows `theme-toggle` between dark and
# light for free. This repo has no shared palette to reference; see
# home/programs/alacritty.nix for the two ANSI palettes and
# home/desktop/theming.nix for the switch.
#
# This file is live-linked to ~/.config/herdr/config.toml (see
# home/programs/herdr.nix), so herdr's own writes — the onboarding flag and the
# in-app Settings screen — land back here and stay in git. Those writes are
# line-based upserts, so they keep these comments but may prepend a top-level
# `onboarding = false` above them.

# Herdr shares the terminal's modifier layer: Alt controls fast navigation,
# while the Ctrl-a prefix keeps the complete keymap available.
[keys]
prefix = "ctrl+a"

# The hidden sidebar is the agent explorer: reveal it directly, then move
# through attention-ordered agent rows without leaving the keyboard.
toggle_sidebar = ["prefix+b", "alt+e"]
previous_agent = "alt+up"
next_agent = "alt+down"

# Direct Alt bindings preserve the tmux navigation vocabulary without entering
# prefix mode. The native Ctrl-a Shift-h/j/k/l pane-swap bindings remain.
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
split_vertical = "alt+enter"
split_horizontal = "shift+f10"
close_pane = "alt+q"
zoom = "alt+f"
goto = "alt+g"
workspace_picker = "alt+w"

# Focus an existing indexed tab, or create a focused tab when that index does
# not exist. Native switch_tab only handles the first case.
[[keys.command]]
key = "alt+1"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 1"
description = "focus or create tab 1"

[[keys.command]]
key = "alt+2"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 2"
description = "focus or create tab 2"

[[keys.command]]
key = "alt+3"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 3"
description = "focus or create tab 3"

[[keys.command]]
key = "alt+4"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 4"
description = "focus or create tab 4"

[[keys.command]]
key = "alt+5"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 5"
description = "focus or create tab 5"

[[keys.command]]
key = "alt+6"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 6"
description = "focus or create tab 6"

[[keys.command]]
key = "alt+7"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 7"
description = "focus or create tab 7"

[[keys.command]]
key = "alt+8"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 8"
description = "focus or create tab 8"

[[keys.command]]
key = "alt+9"
command = "$HOME/.nixos-config/scripts/herdr-select-or-create-tab 9"
description = "focus or create tab 9"

[theme]
name = "terminal"

# herdr has no `on_accent` token: text drawn on an accent background is
# `panel_contrast_fg` (src/ui/widgets.rs), which is `panel_bg`, or `surface_dim`
# when `panel_bg` is `Color::Reset` — which is exactly the `terminal` theme's
# case. So the accent pair that matters is (accent, surface_dim).
#
# `accent = "lightgreen"` is ANSI slot 10, the deliberately lifted bright green
# (#7CDC7F dark / #808080 light); slot 2 (`"green"`, #207F23) sits *below* the
# #4AB34D foreground and left on-accent labels at 1.28:1. `surface_dim = "black"`
# is slot 0 (#0C3A0E dark / #000000 light), the only slot dark enough in the
# Matrix palette to knock out of the accent. Together: 7.62:1 dark, 5.32:1 light.
#
# Both values are ANSI names, so this still follows `theme-toggle`. herdr's
# `parse_color` (src/config/theme.rs) lowercases but does NOT strip spaces or
# dashes, and falls back to *cyan* silently on an unknown name — `"light green"`
# and `"bright green"` are wrong and `config check` will not tell you.
# `[theme.custom] accent` also supersedes the legacy `[ui] accent`, which herdr
# ignores outright once this table sets it.
auto_switch = false
[theme.custom]
accent = "lightgreen"
surface_dim = "black"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
pane_borders = false
pane_gaps = false
show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.toast]
delivery = "system"
