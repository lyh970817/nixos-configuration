onboarding = false
# herdr "zero chrome" layout: sidebar hidden, tab bar hidden while a single
# tab is open, no pane borders or gaps.
#
# `theme.name = "terminal"` selects the one built-in palette that emits plain
# ANSI slots instead of hardcoded RGB, so herdr inherits whatever palette
# foot is currently importing and follows `theme-toggle` between dark and
# light for free. This repo has no shared palette to reference; see
# home/programs/foot.nix for the two ANSI palettes and
# home/desktop/theming.nix for the switch.
#
# This file is live-linked to ~/.config/herdr/config.toml (see
# home/programs/herdr.nix), so herdr's own writes — the onboarding flag and the
# in-app Settings screen — land back here and stay in git. Those writes are
# line-based upserts, so they keep these comments but may prepend a top-level
# `onboarding = false` above them.

# Herdr shares the terminal's modifier layer. Browser-style Ctrl tab controls
# are direct; the Ctrl-a prefix keeps the complete keymap available.
[keys]
prefix = "ctrl+a"
copy_mode = "alt+v"

# The hidden sidebar is the agent explorer: reveal it directly, then move
# through attention-ordered agent rows without leaving the keyboard.
toggle_sidebar = ["prefix+b", "alt+e"]
previous_agent = "alt+up"
next_agent = "alt+down"

# Direct Alt bindings preserve the tmux navigation vocabulary without entering
# prefix mode while retaining the native Ctrl-a Shift pane swaps.
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
swap_pane_left = ["prefix+shift+h", "alt+shift+h"]
swap_pane_down = ["prefix+shift+j", "alt+shift+j"]
swap_pane_up = ["prefix+shift+k", "alt+shift+k"]
swap_pane_right = ["prefix+shift+l", "alt+shift+l"]
split_vertical = "alt+enter"
split_horizontal = "shift+f10"
close_pane = "alt+q"
zoom = "alt+f"
goto = "alt+g"
workspace_picker = "alt+w"
new_workspace = "alt+n"
previous_workspace = "alt+left"
next_workspace = "alt+right"

# Keep the native Ctrl-a index bindings as a secondary direct-jump mechanism.
# Browser-style traversal follows visible tab order and does not assign slots.
switch_tab = "prefix+1..9"
new_tab = "ctrl+t"
previous_tab = ["prefix+p", "ctrl+shift+tab"]
next_tab = ["prefix+n", "ctrl+tab"]

# Match tmux's Ctrl+1 scratch notes, preserving the calling pane's Herdr
# context and cwd when the split is created.
[[keys.command]]
key = "ctrl+1"
type = "shell"
command = "$HOME/.nixos-config/scripts/herdr-scratch-note right"
description = "open a scratch note to the right"

[[keys.command]]
key = "ctrl+shift+1"
type = "shell"
command = "$HOME/.nixos-config/scripts/herdr-scratch-note down"
description = "open a scratch note below"

[theme]
name = "terminal"

# herdr has no `on_accent` token: text drawn on an accent background is
# `panel_contrast_fg` (src/ui/widgets.rs), which is `panel_bg`, or `surface_dim`
# when `panel_bg` is `Color::Reset` — which is exactly the `terminal` theme's
# case. So the accent pair that matters is (accent, surface_dim).
#
# `accent = "lightgreen"` is ANSI slot 10, the deliberately lifted bright green
# (#86E68C dark / #808080 light); slot 2 (`"green"`, #193F20) sits below the
# #4BAE55 foreground. `surface_dim = "black"` is slot 0 (#0B120D dark /
# #000000 light), the dark knockout for the accent. The light palette remains
# unchanged because these values resolve through each terminal's ANSI slots.
#
# Both values are ANSI names, so this still follows `theme-toggle`. herdr's
# `parse_color` (src/config/theme.rs) lowercases but does NOT strip spaces or
# dashes, and falls back to *cyan* silently on an unknown name — `"light green"`
# and `"bright green"` are wrong and `config check` will not tell you.
# `[theme.custom] accent` also supersedes the legacy `[ui] accent`, which herdr
# ignores outright once this table sets it.
#
# The pane text selection is NOT reachable from here and is off-palette:
# `[theme.custom]` has no selection token, and `automatic_selection_bg`
# (src/ui/panes.rs, herdr 0.8.0) derives the field by mixing the terminal's
# OSC 11 background 28% toward white — #050806 becomes #4B4D4C, a grey, on any
# phosphor profile. Known and accepted; fixing it needs a source patch, which
# is more machinery than the blemish is worth. Revisit if upstream adds a
# selection theme token.
auto_switch = false
[theme.custom]
accent = "lightgreen"
surface_dim = "black"

[ui]
prompt_new_tab_name = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true
pane_borders = true
pane_gaps = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = false

agent_panel_sort = "spaces"
[ui.toast]
delivery = "system"
