model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
# Profile for the Matt Pocock/user workflow skill set.
# Select it with: codex --profile mattpocock
[plugins."browser@openai-bundled"]
enabled = false

# All shared-skills entries below are INERT on Codex 0.144.5: no config
# mechanism can load a skill from the unscanned shared-skills pool; only
# ~/.codex/skills is scanned. Kept to record intent until upstream exposes
# extra scan roots (app-server has skills/extraRoots/set, config.toml doesn't).

[[skills.config]]
path = "shared-skills/ask-matt"
enabled = true

