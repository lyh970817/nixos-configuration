
# Profile for Understand Anything plus CodeGraph.
# Select it with: codex --profile understand-anything-codegraph

[plugins."understand-anything@understand-anything"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = false

[plugins."deep-research@openai-bundled"]
enabled = false

[plugins."google-drive@openai-curated-remote"]
enabled = false

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

