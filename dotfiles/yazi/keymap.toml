"$schema" = "https://yazi-rs.github.io/schemas/keymap.json"

[mgr]

prepend_keymap = [
	# Hopping
	{ on = "<C-u>", run = "arrow -5" },
	{ on = "<C-d>", run = "arrow 5" },

	# Navigation
	{ on = "l", run = "plugin smart-enter" },

	{ on = "H", run = "back" },
	{ on = "L", run = "forward" },
	
	{ on = "s", run = "spot" },

	# Operation
	{ on = "<C-l>", run = "link" },

	{ on = "Y", run = 'shell "cp -rL --reflink=auto -- $@ $0" --confirm', desc = "Yank (copy) following symlinks"},

	# Archives
	{ on = "E", run = 'shell "ya pub extract --list %s"', desc = "Extract selected archives here" },
	{ on = "Z", run = 'shell -- n=$(basename %h); zip -r "${n%.*}.zip" -- $(for f in %s; do basename "$f"; done)', desc = "Compress selection into a zip" },

	# Find
	{ on = "n", run = "find_arrow" },
	{ on = "N", run = "find_arrow --previous" },

	# Goto
	{ on = [ "g", "r" ], run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"', desc = "Jump to Git root" },
	# { on = [ "g", "v" ], run = 'shell -- ya emit cd "$(zoxide query Friends)"' },
	{ on = [ "g", "c" ], run = "plugin vcs-files", desc = "Show Git file changes" },

	# Shell
	{ on = "$", run = "shell --block --interactive" },

	# Plugins
	{ on = "M",          run = "plugin mount" },
	{ on = "<C-d>",      run = "plugin diff" },
	{ on = [ "c", "m" ], run = "plugin chmod", desc = "Run chmod" },
	{ on = "+", run = "plugin zoom 1", desc = "Zoom in hovered image" },
	{ on = "-", run = "plugin zoom -1", desc = "Zoom out hovered image" },
	{ on = "<C-1>", run = "plugin toggle-pane max-parent" },
	{ on = "<C-2>", run = "plugin toggle-pane max-current" },
	{ on = "<C-3>", run = "plugin toggle-pane max-preview" },
]

