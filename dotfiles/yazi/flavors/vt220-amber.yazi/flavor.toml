# Yazi VT220 Amber Theme
# A high-contrast VT220 Amber-style theme: warm near-black background with an
# amber luminance ramp. Inspired by classic terminal aesthetics.
# Place this file at ~/.config/yazi/theme.toml

[mgr]

# Current working directory - primary amber on warm black
cwd = { fg = "#D99B32", bg = "#080705", bold = true }

# Hovered file - reverse video for clear selection
hovered = { fg = "#080705", bg = "#BE842A", bold = true }

# Preview hovered - reverse video, one step dimmer
preview_hovered = { fg = "#080705", bg = "#9B6D24" }

# Search highlights - reverse video for visibility
find_keyword = { fg = "#080705", bg = "#D99B32", bold = true }

# Position indicator - accent amber
find_position = { fg = "#BE842A" }

# File markers using different amber levels
marker_copied = { fg = "#BE842A", bg = "#BE842A" }
marker_cut = { fg = "#9B6D24", bg = "#9B6D24" }
marker_marked = { fg = "#D99B32", bg = "#D99B32"}
marker_selected = { fg = "#D99B32", bg = "#D99B32"}

# Count indicators with subtle backgrounds
count_copied = { fg = "#D99B32", bg = "#0C0A06" }
count_cut = { fg = "#D99B32", bg = "#2A2011" }
count_selected = { fg = "#080705", bg = "#BE842A" }

# Border using primary amber
border_style = { fg = "#D99B32" }

# Left empty: Yazi loads this flavor's tmtheme.xml for syntax highlighting.
syntect_theme = ""

[tabs]
# Active tab - high contrast
active = { fg = "#D99B32", bg = "#080705", bold = true }

# Inactive tabs - lower contrast
inactive = { fg = "#6E501D", bg = "#0C0A06" }

# Tab separators
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode - primary amber on warm black
normal_main = { fg = "#D99B32", bg = "#080705", bold = true }
normal_alt = { fg = "#BE842A", bg = "#080705" }

# Select mode - inverted for distinction
select_main = { fg = "#080705", bg = "#D99B32", bold = true }
select_alt = { fg = "#080705", bg = "#BE842A" }

# Unset mode - muted amber to show inactive state
unset_main = { fg = "#6E501D", bg = "#0C0A06" }
unset_alt = { fg = "#9B6D24", bg = "#0C0A06" }

[status]
# Overall status bar
overall = { fg = "#D99B32", bg = "#080705" }

# Status separators
sep_left = { open = "", close = "]" }
sep_right = { open = "[", close = "" }

# Permission indicators with varying amber levels
perm_type = { fg = "#D99B32", bold = true }
perm_read = { fg = "#BE842A" }
perm_write = { fg = "#9B6D24" }
perm_exec = { fg = "#D99B32", bold = true }
perm_sep = { fg = "#6E501D" }

# Progress indicators
progress_label = { fg = "#D99B32", bold = true }
progress_normal = { fg = "#080705", bg = "#BE842A" }
progress_error = { fg = "#080705", bg = "#D99B32", bold = true }

[which]
# Key help display
cols = 2
mask = { bg = "#0C0A06" }
cand = { fg = "#D99B32", bold = true }
rest = { fg = "#BE842A" }
desc = { fg = "#BE842A" }
separator = " → "
separator_style = { fg = "#6E501D" }

[confirm]
# Confirmation dialogs
border = { fg = "#D99B32" }
title = { fg = "#D99B32", bold = true }
content = { fg = "#D99B32" }
list = { fg = "#BE842A" }
btn_yes = { fg = "#D99B32", bg = "#080705", bold = true }
btn_no = { fg = "#D99B32", bg = "#080705" }

[spot]
# Search/spotlight features
border = { fg = "#6E501D" }
title = { fg = "#D99B32", bold = true }
tbl_col = { fg = "#080705", bg = "#9B6D24" }
tbl_cell = { fg = "#080705", bg = "#BE842A" }

[notify]
# Notification styles - using bold for emphasis
title_info = { fg = "#D99B32", bold = true }
title_warn = { fg = "#D99B32", bg = "#2A2011", bold = true }
title_error = { fg = "#080705", bg = "#D99B32", bold = true }

[pick]
# Picker dialogs
border = { fg = "#6E501D" }
active = { fg = "#080705", bg = "#BE842A", bold = true }
inactive = { fg = "#9B6D24" }

[input]
# Input fields
border = { fg = "#D99B32" }
title = { fg = "#D99B32", bold = true }
value = { fg = "#D99B32" }
selected = { fg = "#080705", bg = "#BE842A" }

[cmp]
# Completion menu
border = { fg = "#6E501D" }
active = { fg = "#080705", bg = "#BE842A", bold = true }
inactive = { fg = "#9B6D24" }
# icon_file = "▸"
# icon_folder = "▾"
# icon_command = "›"

[tasks]
# Task manager
border = { fg = "#6E501D" }
title = { fg = "#D99B32", bold = true }
hovered = { fg = "#080705", bg = "#9B6D24" }

[help]
# Help menu
on = { fg = "#D99B32", bold = true }
run = { fg = "#BE842A" }
desc = { fg = "#9B6D24" }
hovered = { fg = "#080705", bg = "#BE842A" }
footer = { fg = "#6E501D", bg = "#0C0A06" }
# icon_info = "ℹ"
# icon_warn = "⚠"
# icon_error = "✕"

[filetype]
# File type rules using amber luminance distinctions
rules = [
    # Directories - primary amber bold
    { name = "*/", fg = "#D99B32", bold = true },

    # Executables - accent amber with bold
    { name = "*", is = "exec", fg = "#BE842A", bold = true },

    # Archives - secondary amber
    { mime = "application/zip", fg = "#9B6D24" },
    { mime = "application/x-tar", fg = "#9B6D24" },
    { mime = "application/x-gzip", fg = "#9B6D24" },
    { mime = "application/x-bzip", fg = "#9B6D24" },
    { mime = "application/x-7z-compressed", fg = "#9B6D24" },

    # Documents - accent amber
    { mime = "application/pdf", fg = "#BE842A" },
    { mime = "application/msword", fg = "#BE842A" },
    { mime = "application/vnd.*", fg = "#BE842A" },

    # Images - secondary amber
    { mime = "image/*", fg = "#9B6D24" },

    # Videos/Audio - muted amber
    { mime = "video/*", fg = "#6E501D" },
    { mime = "audio/*", fg = "#6E501D" },

    # Text files - primary amber
    { mime = "text/*", fg = "#D99B32" },

    # Code files - primary amber
    { name = "*.py", fg = "#D99B32" },
    { name = "*.js", fg = "#D99B32" },
    { name = "*.rs", fg = "#D99B32" },
    { name = "*.go", fg = "#D99B32" },
    { name = "*.c", fg = "#D99B32" },
    { name = "*.cpp", fg = "#D99B32" },
    { name = "*.h", fg = "#D99B32" },
    { name = "*.java", fg = "#D99B32" },

    # Config files - secondary amber
    { name = "*.toml", fg = "#9B6D24" },
    { name = "*.yaml", fg = "#9B6D24" },
    { name = "*.yml", fg = "#9B6D24" },
    { name = "*.json", fg = "#9B6D24" },
    { name = "*.xml", fg = "#9B6D24" },
    { name = "*.ini", fg = "#9B6D24" },

    # Hidden files - muted amber
    { name = ".*", fg = "#6E501D" },

    # Symbolic links - accent amber italic
    { name = "*", is = "link", fg = "#BE842A", italic = true },

    # Broken links - primary amber on deep surface
    { name = "*", is = "orphan", fg = "#D99B32", bg = "#0C0A06" },

    # Empty files - border amber
    { mime = "inode/empty", fg = "#2A2011" },

    # Fallback - secondary amber
    { name = "*", fg = "#9B6D24" }
]

[icon]
# Upstream ships a large multicolor application-logo table. Shadow all of it
# with one monochrome marker per category: `prepend_globs` is the first stage
# Yazi consults, so the trailing "**" catch-all keeps upstream's `files` and
# `exts` entries from ever being reached.
#
# No `fg` is set on purpose. An icon without an explicit color inherits the
# color of its [filetype] rule, so markers follow the same amber luminance
# hierarchy as the file names instead of forming a second, competing one.
#
# Directories are deliberately not matched here: patterns without a trailing
# slash only match non-directories, so folders keep upstream's monochrome
# folder glyph, which already inherits the bright amber directory color.
prepend_globs = [
    { url = "*.{jpg,jpeg,png,gif,bmp,webp,avif,tiff,tif,ico,svg,heic,heif}", text = "" },
    { url = "*.{mp4,mkv,webm,mov,avi,m4v,mpg,mpeg,wmv,flv}", text = "" },
    { url = "*.{mp3,flac,wav,ogg,opus,m4a,aac,wma,mid,midi}", text = "" },
    { url = "*.{zip,tar,gz,tgz,bz2,xz,zst,7z,rar,lz4,lzma,iso,dmg,deb,rpm}", text = "" },
    { url = "*.{pdf,epub,mobi,djvu,doc,docx,odt,rtf,ppt,pptx,xls,xlsx,ods,odp}", text = "" },
    { url = "*.{toml,yaml,yml,json,jsonc,ini,cfg,conf,env,lock,plist,xml}", text = "" },
    { url = "*.{md,markdown,txt,text,log,rst,org,adoc,tex,csv,tsv}", text = "" },
    { url = "*.{sh,bash,zsh,fish,ps1,bat,cmd}", text = "" },
    { url = "*.{nix,c,h,cc,cpp,hpp,rs,go,py,pyi,js,mjs,cjs,ts,tsx,jsx,lua,vim,rb,pl,php,java,kt,swift,scala,hs,ml,ex,exs,erl,clj,r,jl,zig,sql,css,scss,html,htm}", text = "" },

    # Everything else, including files with no extension.
    { url = "**", text = "" },
]
