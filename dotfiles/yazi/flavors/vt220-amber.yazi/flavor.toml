# Yazi VT220 Amber Theme
# A high-contrast VT220 Amber-style theme: warm near-black background with an
# amber luminance ramp. Inspired by classic terminal aesthetics.
# Place this file at ~/.config/yazi/theme.toml

[mgr]

# Current working directory - primary amber on warm black
cwd = { fg = "#4BAE55", bg = "#050806", bold = true }

# Hovered file - reverse video for clear selection
hovered = { fg = "#050806", bg = "#3D8E48", bold = true }

# Preview hovered - reverse video, one step dimmer
preview_hovered = { fg = "#050806", bg = "#286731" }

# Search highlights - reverse video for visibility
find_keyword = { fg = "#050806", bg = "#4BAE55", bold = true }

# Position indicator - accent amber
find_position = { fg = "#3D8E48" }

# File markers using different amber levels
marker_copied = { fg = "#3D8E48", bg = "#3D8E48" }
marker_cut = { fg = "#286731", bg = "#286731" }
marker_marked = { fg = "#4BAE55", bg = "#4BAE55"}
marker_selected = { fg = "#4BAE55", bg = "#4BAE55"}

# Count indicators with subtle backgrounds
count_copied = { fg = "#4BAE55", bg = "#080C09" }
count_cut = { fg = "#4BAE55", bg = "#15261A" }
count_selected = { fg = "#050806", bg = "#3D8E48" }

# Border using primary amber
border_style = { fg = "#4BAE55" }

# Left empty: Yazi loads this flavor's tmtheme.xml for syntax highlighting.
syntect_theme = ""

[tabs]
# Active tab - high contrast
active = { fg = "#4BAE55", bg = "#050806", bold = true }

# Inactive tabs - lower contrast
inactive = { fg = "#193F20", bg = "#080C09" }

# Tab separators
sep_inner = { open = "[", close = "]" }
sep_outer = { open = "", close = "" }

[mode]
# Normal mode - primary amber on warm black
normal_main = { fg = "#4BAE55", bg = "#050806", bold = true }
normal_alt = { fg = "#3D8E48", bg = "#050806" }

# Select mode - inverted for distinction
select_main = { fg = "#050806", bg = "#4BAE55", bold = true }
select_alt = { fg = "#050806", bg = "#3D8E48" }

# Unset mode - muted amber to show inactive state
unset_main = { fg = "#193F20", bg = "#080C09" }
unset_alt = { fg = "#286731", bg = "#080C09" }

[status]
# Overall status bar
overall = { fg = "#4BAE55", bg = "#050806" }

# Status separators
sep_left = { open = "", close = "]" }
sep_right = { open = "[", close = "" }

# Permission indicators with varying amber levels
perm_type = { fg = "#4BAE55", bold = true }
perm_read = { fg = "#3D8E48" }
perm_write = { fg = "#286731" }
perm_exec = { fg = "#4BAE55", bold = true }
perm_sep = { fg = "#193F20" }

# Progress indicators
progress_label = { fg = "#4BAE55", bold = true }
progress_normal = { fg = "#050806", bg = "#3D8E48" }
progress_error = { fg = "#050806", bg = "#4BAE55", bold = true }

[which]
# Key help display
cols = 2
mask = { bg = "#080C09" }
cand = { fg = "#4BAE55", bold = true }
rest = { fg = "#3D8E48" }
desc = { fg = "#3D8E48" }
separator = " → "
separator_style = { fg = "#193F20" }

[confirm]
# Confirmation dialogs
border = { fg = "#4BAE55" }
title = { fg = "#4BAE55", bold = true }
content = { fg = "#4BAE55" }
list = { fg = "#3D8E48" }
btn_yes = { fg = "#4BAE55", bg = "#050806", bold = true }
btn_no = { fg = "#4BAE55", bg = "#050806" }

[spot]
# Search/spotlight features
border = { fg = "#193F20" }
title = { fg = "#4BAE55", bold = true }
tbl_col = { fg = "#050806", bg = "#286731" }
tbl_cell = { fg = "#050806", bg = "#3D8E48" }

[notify]
# Notification styles - using bold for emphasis
title_info = { fg = "#4BAE55", bold = true }
title_warn = { fg = "#4BAE55", bg = "#15261A", bold = true }
title_error = { fg = "#050806", bg = "#4BAE55", bold = true }

[pick]
# Picker dialogs
border = { fg = "#193F20" }
active = { fg = "#050806", bg = "#3D8E48", bold = true }
inactive = { fg = "#286731" }

[input]
# Input fields
border = { fg = "#4BAE55" }
title = { fg = "#4BAE55", bold = true }
value = { fg = "#4BAE55" }
selected = { fg = "#050806", bg = "#3D8E48" }

[cmp]
# Completion menu
border = { fg = "#193F20" }
active = { fg = "#050806", bg = "#3D8E48", bold = true }
inactive = { fg = "#286731" }
# icon_file = "▸"
# icon_folder = "▾"
# icon_command = "›"

[tasks]
# Task manager
border = { fg = "#193F20" }
title = { fg = "#4BAE55", bold = true }
hovered = { fg = "#050806", bg = "#286731" }

[help]
# Help menu
on = { fg = "#4BAE55", bold = true }
run = { fg = "#3D8E48" }
desc = { fg = "#286731" }
hovered = { fg = "#050806", bg = "#3D8E48" }
footer = { fg = "#193F20", bg = "#080C09" }
# icon_info = "ℹ"
# icon_warn = "⚠"
# icon_error = "✕"

[filetype]
# File type rules using amber luminance distinctions
rules = [
    # Directories - primary amber bold
    { url = "*/", fg = "#4BAE55", bold = true },

    # Executables - accent amber with bold
    { url = "*", is = "exec", fg = "#3D8E48", bold = true },

    # Archives - secondary amber
    { mime = "application/zip", fg = "#286731" },
    { mime = "application/x-tar", fg = "#286731" },
    { mime = "application/x-gzip", fg = "#286731" },
    { mime = "application/x-bzip", fg = "#286731" },
    { mime = "application/x-7z-compressed", fg = "#286731" },

    # Documents - accent amber
    { mime = "application/pdf", fg = "#3D8E48" },
    { mime = "application/msword", fg = "#3D8E48" },
    { mime = "application/vnd.*", fg = "#3D8E48" },

    # Images - secondary amber
    { mime = "image/*", fg = "#286731" },

    # Videos/Audio - muted amber
    { mime = "video/*", fg = "#193F20" },
    { mime = "audio/*", fg = "#193F20" },

    # Text files - primary amber
    { mime = "text/*", fg = "#4BAE55" },

    # Code files - primary amber
    { url = "*.py", fg = "#4BAE55" },
    { url = "*.js", fg = "#4BAE55" },
    { url = "*.rs", fg = "#4BAE55" },
    { url = "*.go", fg = "#4BAE55" },
    { url = "*.c", fg = "#4BAE55" },
    { url = "*.cpp", fg = "#4BAE55" },
    { url = "*.h", fg = "#4BAE55" },
    { url = "*.java", fg = "#4BAE55" },

    # Config files - secondary amber
    { url = "*.toml", fg = "#286731" },
    { url = "*.yaml", fg = "#286731" },
    { url = "*.yml", fg = "#286731" },
    { url = "*.json", fg = "#286731" },
    { url = "*.xml", fg = "#286731" },
    { url = "*.ini", fg = "#286731" },

    # Hidden files - muted amber
    { url = ".*", fg = "#193F20" },

    # Symbolic links - accent amber italic
    { url = "*", is = "link", fg = "#3D8E48", italic = true },

    # Broken links - primary amber on deep surface
    { url = "*", is = "orphan", fg = "#4BAE55", bg = "#080C09" },

    # Empty files - border amber
    { mime = "inode/empty", fg = "#15261A" },

    # Fallback - secondary amber
    { url = "*", fg = "#286731" }
]

[icon]
# Upstream ships a large multicolor application-logo table. Shadow all of it
# with one monochrome marker per category: `prepend_globs` is the first stage
# Yazi consults, so the trailing "**" catch-all keeps upstream's `files` and
# `exts` entries from ever being reached.
#
# No `fg` is set on purpose. An icon without an explicit color inherits the
# color of its [filetype] rule, so markers follow the same amber luminance
# hierarchy as the file names instead of forming a second, competing one.
#
# Directories are deliberately not matched here: patterns without a trailing
# slash only match non-directories, so folders keep upstream's monochrome
# folder glyph, which already inherits the bright amber directory color.
# Since Yazi 26.5 upstream's icon table colors directory icons explicitly (a
# generic blue folder via an `if = "dir"` cond, plus per-name icons for
# Desktop, Downloads, etc. in `dirs`), so directories no longer pick up the
# [filetype] "*/" color from an unstyled icon. Merged (prepend_*) rules that
# match directories hit a 26.5 quirk that strips the whole row's colors, so
# both lists are *replaced* instead; and because the no-fg inherit behavior
# is broken for directories (icon and filename both lose their color) and
# hex values are silently dropped on icon rules, the fg is the ANSI "blue"
# slot, which this setup's terminal palettes map to the accent colour
# (foot regular4) -- it also tracks the live green/amber phosphor swap.
dirs = []
conds = [
    { if = "dir & hovered", text = "", fg = "blue" },
    { if = "dir", text = "", fg = "blue" },
]

prepend_globs = [
    { url = "*.{jpg,jpeg,png,gif,bmp,webp,avif,tiff,tif,ico,svg,heic,heif}", text = "" },
    { url = "*.{mp4,mkv,webm,mov,avi,m4v,mpg,mpeg,wmv,flv}", text = "" },
    { url = "*.{mp3,flac,wav,ogg,opus,m4a,aac,wma,mid,midi}", text = "" },
    { url = "*.{zip,tar,gz,tgz,bz2,xz,zst,7z,rar,lz4,lzma,iso,dmg,deb,rpm}", text = "" },
    { url = "*.{pdf,epub,mobi,djvu,doc,docx,odt,rtf,ppt,pptx,xls,xlsx,ods,odp}", text = "" },
    { url = "*.{toml,yaml,yml,json,jsonc,ini,cfg,conf,env,lock,plist,xml}", text = "" },
    { url = "*.{md,markdown,txt,text,log,rst,org,adoc,tex,csv,tsv}", text = "" },
    { url = "*.{sh,bash,zsh,fish,ps1,bat,cmd}", text = "" },
    { url = "*.{nix,c,h,cc,cpp,hpp,rs,go,py,pyi,js,mjs,cjs,ts,tsx,jsx,lua,vim,rb,pl,php,java,kt,swift,scala,hs,ml,ex,exs,erl,clj,r,jl,zig,sql,css,scss,html,htm}", text = "" },

    # Everything else, including files with no extension.
    { url = "**", text = "" },
]
