# Modified from upstream: https://github.com/sxyazi/dotfiles/tree/main/yazi

[mgr]
# Layout ratios: [parent, current, preview]
# Setting parent to 0 removes the left pane
ratio = [0, 3, 4]

# Show borders
show_border = true

linemode    = "size"
sort_by     = "natural"

[preview]
wrap       = "yes"
max_width  = 1500
max_height = 1500

[opener]
edit = [
	{ run = '$EDITOR "$@"', desc = "$EDITOR", block = true },
]
play = [
	{ run = 'mpv --force-window "$@"' },
]
image = [
	# Dispatches to the laptop when this Yazi is being driven over mosh,
	# otherwise opens locally. See home/programs/image-open.nix.
	{ run = 'yazi-open-image "$@"', desc = "Open image", orphan = true },
]
html = [
	# Serves the file's directory to the laptop when this Yazi is being driven
	# over mosh, otherwise opens locally. See home/programs/html-open.nix.
	{ run = 'open-html "$@"', desc = "Open in browser", orphan = true },
]
extract = [
	{ run = 'ya pub extract --list "$@"', desc = "Extract here" },
]
subtitle = [
	{ run = ''' python3 -c 'import socket, sys; s = socket.socket(socket.AF_UNIX); s.connect("/tmp/mpv.sock"); s.sendall(f"sub-add \"{sys.argv[1]}\"\n".encode())' "$0" ''', desc = "Add sub to MPV" },
]

[open]
prepend_rules = [
	{ url = "*.{ass,srt,ssa,sty,sup,vtt}", use = [ "subtitle", "edit" ] },
	{ url = "*.{html,htm}", use = [ "html", "edit" ] },
	# Remote files start out as vfs/absent, so this only matches once Yazi has
	# cached the file locally -- the built-in download rule runs first.
	{ mime = "image/*", use = [ "image", "edit" ] },
]

[plugin]
prepend_previewers = [
	{ url = "*.pdf", run = "pdf" },
	{ mime = "video/*", run = "video" },
	{ mime = "audio/*", run = "video" },
	{ mime = "application/json", run = 'piper -- jq --color-output . "$1"' },
	{ url = "*.json", run = 'piper -- jq --color-output . "$1"' },
	{ url = "*.tar*", run = 'piper --format=url -- tar tf "$1"' },
	{ url = "*.{csv,tsv,md}", run = 'piper -- bat -p --color=always "$1"' },
]

prepend_fetchers = [
	{ group = "git", url = "*", run = "git" },
	{ group = "git", url = "*/", run = "git" },
]
