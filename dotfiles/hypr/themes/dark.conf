general {
    gaps_in = 20
    gaps_out = 30
    border_size = 3
    col.active_border = rgba(056608ff)
}
misc {
    background_color = 0x000000
}

decoration {
    rounding = 4

    # Change transparency of focused and unfocused windows
    inactive_opacity = 0.7
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

env = HYPRCURSOR_THEME,Hacker-C
env = XCURSOR_THEME,Hacker-C

# Wallpaper for startup (Pure black, no image)
exec-once = pkill swaybg; swaybg -c 000000
exec-once = $TERMINAL --command tmux new-session -A -s main
exec-once = hyprctl setcursor Hacker-C 24
