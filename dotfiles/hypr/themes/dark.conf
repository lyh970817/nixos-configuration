general {
    gaps_in = 8
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(3D8E48ff)
    col.inactive_border = rgba(15261Aff)
}
misc {
    background_color = 0x050806
}

decoration {
    rounding = 4
    # Panel shader. The amber-tinted bloom and black lift that made the old
    # one contaminate green colour measurements are both gone: the lift was
    # removed outright and the remaining tints follow the phosphor. Note that
    # theming.nix sets this live on every mode switch, so this line only
    # governs a cold start.
    screen_shader = ~/.config/hypr/shaders/panel.glsl

    # Change transparency of focused and unfocused windows
    inactive_opacity = 1
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

env = HYPRCURSOR_THEME,Adwaita
env = XCURSOR_THEME,Adwaita

# Brown-black CRT glass background for startup.
exec-once = pkill swaybg || true; setsid -f swaybg -c 050806
# exec-once = $TERMINAL --app-id foot-main tmux new-session -A -s main
exec-once = hyprctl setcursor Adwaita 24
