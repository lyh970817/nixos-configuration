general {
    gaps_in = 8
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(BE842Aff)
    col.inactive_border = rgba(2A2011ff)
}
misc {
    background_color = 0x080705
}

decoration {
    rounding = 0
    screen_shader = ~/.config/hypr/shaders/vt220-amber.glsl

    # Change transparency of focused and unfocused windows
    inactive_opacity = 1
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

env = HYPRCURSOR_THEME,Adwaita
env = XCURSOR_THEME,Adwaita

# Brown-black CRT glass background for startup.
exec-once = pkill swaybg || true; setsid -f swaybg -c 080705
# exec-once = $TERMINAL --app-id foot-main tmux new-session -A -s main
exec-once = hyprctl setcursor Adwaita 24
