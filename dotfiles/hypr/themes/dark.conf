# TRANSITIONAL -- FROZEN SNAPSHOT of the legacy mode theme. Aside from the
# shared headless-test guard, do not edit; edit the .lua twin instead. See the
# header of ../hyprland.conf for why this cannot drift, and for the condition
# under which it gets deleted.

general {
    gaps_in = 8
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(3D8E48ff)
    col.inactive_border = rgba(15261Aff)
}
misc {
    background_color = 0x050806
}

decoration {
    rounding = 4
    # screen-shader owns the live shader setting so cold starts, monitor IDs,
    # theme mode, and the manual preference all follow one policy.

    # Change transparency of focused and unfocused windows
    inactive_opacity = 1
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# Startup cursor, so a dark-mode login matches switch-dark without waiting for
# it. No hyprcursor variant of this theme is built, and no hyprcursor theme is
# installed on this machine at all (nothing on the icon path ships a
# manifest.hl), so HYPRCURSOR_THEME never resolves and Hyprland always takes the
# XCursor path -- exactly what Adwaita did here before. Verified, not assumed:
# CCursorManager::changeTheme only reaches CXCursorManager::syncGsettings on the
# XCursor fallback branch, and a `hyprctl setcursor <theme> <size>` does write
# that size straight back into gsettings.
#
# These three are only read when a client starts, so they govern client-drawn
# cursors (foot, Chromium/Electron, anything on libwayland-cursor) rather than
# the compositor's own pointer, which follows `hyprctl setcursor` below. A
# client that was already running keeps whatever it started with; switch-dark /
# switch-light push these into Hyprland's environment so at least newly spawned
# clients follow the mode.
env = HYPRCURSOR_THEME,Bibata-Original-VT220
env = XCURSOR_THEME,Bibata-Original-VT220
env = XCURSOR_SIZE,22

# Rock-art frieze on the brown-black CRT glass background, for startup.
exec-once = ~/.config/hypr/scripts/run-session-startup.sh sh -c 'pkill swaybg || true; setsid -f swaybg -i $HOME/.local/share/wallpapers/Petroglyph_frieze.png -m center -c 050806'
# exec-once = $TERMINAL --app-id foot-main tmux new-session -A -s main
exec-once = ~/.config/hypr/scripts/run-session-startup.sh hyprctl setcursor Bibata-Original-VT220 22
