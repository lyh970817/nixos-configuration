general {
    gaps_in = 8
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(3D8E48ff)
    col.inactive_border = rgba(15261Aff)
}
misc {
    background_color = 0x050806
}

decoration {
    rounding = 4
    # The CRT optical-softness shader is off: its bloom and black lift are
    # warm-tinted (vec3(1.0, 0.72, 0.34)), which casts amber over the green
    # phosphor and skews any colour measurement taken from a screenshot.
    # The file is kept at ~/.config/hypr/shaders/vt220-amber.glsl if wanted back.

    # Change transparency of focused and unfocused windows
    inactive_opacity = 1
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

env = HYPRCURSOR_THEME,Adwaita
env = XCURSOR_THEME,Adwaita

# Brown-black CRT glass background for startup.
exec-once = pkill swaybg || true; setsid -f swaybg -c 050806
# exec-once = $TERMINAL --app-id foot-main tmux new-session -A -s main
exec-once = hyprctl setcursor Adwaita 24
