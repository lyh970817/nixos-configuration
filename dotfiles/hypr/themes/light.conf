# TRANSITIONAL -- FROZEN SNAPSHOT of the legacy mode theme. Aside from the
# shared headless-test guard, do not edit; edit the .lua twin instead. See the
# header of ../hyprland.conf for why this cannot drift, and for the condition
# under which it gets deleted.

general {
    gaps_in = 4
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(000000ff)
    col.inactive_border = rgba(00000000)
}
misc {
    background_color = 0xffffff
}

decoration {
    rounding = 4
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    inactive_opacity = 0.7
    active_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

env = HYPRCURSOR_THEME,Adwaita
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# Wallpaper for startup
exec-once = ~/.config/hypr/scripts/run-session-startup.sh hyprctl setcursor Adwaita 24
exec-once = ~/.config/hypr/scripts/run-session-startup.sh sh -c 'pkill swaybg || true; setsid -f swaybg -i $HOME/.local/share/wallpapers/Taiji_mandala.png -m fit -c ffffff'
