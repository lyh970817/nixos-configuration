#######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
#######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/
# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = ~/.local/state/hypr/current-theme.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=desc:DSC Paperlike H D,2200x1650@40,0x0,1.6


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
# $fileManagerCli = alacritty -e zsh -c 'echo "which $EDITOR" && sleep 2'
$fileManagerCli = alacritty -e $SHELL -l -c yazi
$menu = rofi -show drun -location 2
$window_select = rofi -show window -location 2


#################
### AUTOSTART ###
#################
env = XCURSOR_SIZE,24


# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = nm-applet &
exec-once = mako &
exec-once = fcitx5 -d --replace
exec-once = ~/.config/hypr/scripts/monitor-switch.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprwhspr.service
exec-once = $terminal --class Alacritty-btop --title btop-dashboard --command ~/.config/hypr/scripts/btop-dashboard.sh


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
# See https://wiki.hyprland.org/Configuring/Environment-variables/



###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 15

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    # col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    # col.inactive_border = rgba(595959aa)

    # col.active_border = rgba(056608ff)      # Green border for focused window
    # col.active_border = rgba(000000ff)      # Black border for focused window
    col.inactive_border = rgba(00000000)    # Transparent (no border) for unfocused
    # col.active_border = rgba(00000000)    # Transparent (no border) for unfocused


    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

cursor {
  inactive_timeout = 0.1
  hide_on_key_press = true
  }

# https://wiki.hyprland.org/Configuring/Variables/#decoration
# decoration {
#     rounding = 4
#     # rounding_power = 2
#
#     # Change transparency of focused and unfocused windows
#     # active_opacity = 0.85
#     # active_opacity = 1
#     # inactive_opacity = 0.7
#     # active_opacity = 0.95
#     # active_opacity = 1
#     # inactive_opacity = 0.7
#
#     shadow {
#         enabled = false
#         range = 4
#         render_power = 3
#         color = rgba(1a1a1aee)
#     }
#
#     # https://wiki.hyprland.org/Configuring/Variables/#blur
#     blur {
#         enabled = false
#         size = 3
#         passes = 1
#
#         vibrancy = 0.1696
#     }
# }

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    background_color = 0xffffff
    # background_color = 0x000000
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    # kb_variant =
    # kb_model =
    # kb_options =
    # kb_rules =

    follow_mouse = 3
    float_switch_override_focus = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# # https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = pnp0c50:00-093a:0255-touchpad
    enabled = true
}

###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, RETURN, exec, ~/.config/hypr/scripts/terminal-here.sh

# Super + Enter: Attach to the 'main' tmux session (or create it if missing) - floating
bind = $mainMod, Return, exec, $terminal --class Alacritty-float --command tmux new-session -A -s main
# Super + Shift + Enter: Launch a completely fresh tmux session - floating
bind = $mainMod SHIFT, Return, exec, $terminal --class Alacritty-float --command tmux new-session -A -s secondary
bind = $mainMod, W, exec, brave
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/protected-dispatch.sh killactive
# bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManagerCli
bind = $mainMod SHIFT, E, exec, $fileManager
# bind = $mainMod SUPER, T, exec, ~/.config/hypr/scripts/toggle-topright.sh
# bind = $mainMod SUPER SHIFT, T, centerwindow
bind = $mainMod, S, exec, ~/.config/hypr/scripts/protected-dispatch.sh togglefloating
bind = $mainMod, F, exec, ~/.config/hypr/scripts/protected-dispatch.sh fullscreen 1
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, $window_select
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, P, exec, wtype -s 500 "Green0day" -k Return
bind = $mainMod, V, togglesplit, # dwindle
bind = $mainMod, D, exec, ~/.config/hypr/scripts/show-datetime.sh
bindd = CTRL SHIFT, O, Speech-to-text, exec, hyprwhspr record toggle
bindd = CTRL SHIFT, L, Long-form dictation, exec, hyprwhspr-longform toggle
bind = SUPER, ESCAPE, exec, hyprwhspr-longform cancel

bind = ALT SHIFT, B, alterzorder, bottom

# Move focus with mainMod + arrow keys

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, Tab, cyclenext
# bind = $mainMod, Tab, bringactivetotop
bind = $mainMod SHIFT, Tab, cyclenext, prev

# Move window with mainMod + arrow keys
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/protected-dispatch.sh swapwindow l
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/protected-dispatch.sh swapwindow r
bind = $mainMod SHIFT, K, exec, ~/.config/hypr/scripts/protected-dispatch.sh swapwindow u
bind = $mainMod SHIFT, J, exec, ~/.config/hypr/scripts/protected-dispatch.sh swapwindow d
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/protected-dispatch.sh moveactive -30 0
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/protected-dispatch.sh moveactive 30 0
bind = $mainMod SHIFT, K, exec, ~/.config/hypr/scripts/protected-dispatch.sh moveactive 0 -30
bind = $mainMod SHIFT, J, exec, ~/.config/hypr/scripts/protected-dispatch.sh moveactive 0 30

# Move to workspace 10 as a "minimized" area
# bind = SUPER, M, movetoworkspacesilent, 10
bind = SUPER, M, exec, ~/.config/hypr/scripts/move-and-tile.sh

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/scripts/protected-dispatch.sh movetoworkspace 10

# Example special workspace (scratchpad)
# bind = $mainMod SHIFT, M, togglespecialworkspace, magic
# bind = $mainMod, M, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Resize active window with Super + Arrow Keys
binde = SUPER, right, exec, ~/.config/hypr/scripts/protected-dispatch.sh resizeactive 10 0
binde = SUPER, left, exec, ~/.config/hypr/scripts/protected-dispatch.sh resizeactive -10 0
binde = SUPER, up, exec, ~/.config/hypr/scripts/protected-dispatch.sh resizeactive 0 -10
binde = SUPER, down, exec, ~/.config/hypr/scripts/protected-dispatch.sh resizeactive 0 10

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule

#################################
### NEW SYNTAX (BLOCK FORMAT) ###
#################################

# --- State-Based Rules ---

# Fullscreen behavior: No borders, no rounding, full opacity
windowrule {
    name = fullscreen-state
    match:fullscreen = 1
    border_size = 0
    rounding = 0
    opacity = 1.0 1.0
}

# # Floating behavior: Transparent when inactive
# # (Sets Active=1.0, Inactive=0.2)
# windowrulev2 = opacity 1.0 0.6, floating:0
#
# # Rule 2: Floating Windows (Floating: 1)
# # Active = 1.0, Inactive = 0.1
# windowrulev2 = opacity 1.0 0.1, floating:1

# --- Application Rules ---

# Brave: Fix maximize events
windowrule {
    name = brave
    match:class = ^(brave-browser)$
    suppress_event = maximize
}

# File Managers (Thunar)
windowrule {
    name = thunar
    match:class = ^(Thunar|thunar)$
    float = true
}

# Terminal (Alacritty) - floating windows launched via keybindings
windowrule {
    name = alacritty-float
    match:class = ^(Alacritty-float)$
    float = true
    size = 1000 700
    center = true
}

# Main Terminal (Startup) - tile (not fullscreen)
windowrule {
    name = alacritty-main
    match:class = ^(Alacritty-main)$
    float = false
}

# Network Manager (nmtui)
# Note: Ensure you launch with `alacritty --class nmtui -e nmtui`
windowrule {
    name = nmtui-tile
    match:title = ^(nmtui)$
    float = false
    pseudo = true
}

# LocalSend
windowrule {
    name = localsend
    match:class = ^(localsend_app)$
    float = true
    size = 800 600
    center = true
}

# --- Workspace Specific Rules ---

# Force tiling on Workspace 10
windowrule {
    name = workspace-10-force-tile
    match:workspace = 10
    float = false
}

# Persistent full-screen btop dashboard on Super+0 / workspace 10. Keep this
# after the general workspace-10 rule so its fullscreen state takes precedence.
windowrule {
    name = btop-dashboard
    match:class = ^(Alacritty-btop)$
    workspace = 10 silent
    float = false
    fullscreen_state = 2 0
    border_size = 0
    rounding = 0
    no_initial_focus = true
}

# --- Global Defaults ---

# Ignore maximize requests from all apps (Global fallback)
windowrule {
    name = global-no-maximize
    match:class = .*
    suppress_event = maximize
}


windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Yazi Image Preview (Ueberzugpp)
windowrule {
    name = yazi-ueberzug
    # Matches "ueberzugpp_" followed by anything
    match:class = ^(ueberzugpp_.*)$
    float = true
    no_focus = true
}
