mixed-port: 7890
external-controller: 127.0.0.1:9090
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
profile:
    store-selected: true
    tracing: false
    store-fake-ip: false
unified-delay: true
tun:
    enable: true
    stack: gvisor
    dns-hijack:
        - any:53
    auto-route: true
    auto-detect-interface: true
hosts:
    localhost.localhost: 127.0.0.1
    
dns:
    enable: true
    ipv6: false
    listen: '0.0.0.0:1053'
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    default-nameserver: [223.5.5.5, 119.29.29.29]
    nameserver: [223.5.5.5, 223.6.6.6]
    fake-ip-filter: ['*.lan', localhost.ptlogin2.qq.com, dns.msftncsi.com, '*.srv.nintendo.net', '*.stun.playstation.net', 'xbox.*.microsoft.com', '*.xboxlive.com', '*.tailscale.com']
proxy-providers:
    subscription:
        type: http
        url: "<subscription-url>"
        interval: 3600
        path: ./subscription.yaml
        health-check:
            enable: true
            interval: 600
            url: http://cp.cloudflare.com/generate_204
proxies:
proxy-groups:
    - { name: SSRDOG, type: select, use: [subscription] }
    - { name: Auto, type: url-test, use: [subscription], url: 'http://cp.cloudflare.com/generate_204', interval: 300 }
rule-providers:
    YouTube: { type: http, behavior: classical, url: 'https://api-gz.hosbbq.com/nus74f89st1/Y.yml', interval: 86400, path: ./ruleset/YouTube.yml }
    SteamCN: { type: http, behavior: classical, url: 'https://api-gz.hosbbq.com/nus74f89st1/SC.yml', interval: 86400, path: ./ruleset/SteamCN.yml }
    Bahamut: { type: http, behavior: classical, url: 'https://api-gz.hosbbq.com/nus74f89st1/Ba.yml', interval: 86400, path: ./ruleset/Bahamut.yml }
    DMM: { type: http, behavior: classical, url: 'https://api-gz.hosbbq.com/nus74f89st1/DM.yml', interval: 86400, path: ./ruleset/DMM.yml }
    ChinaMax: { type: http, behavior: classical, url: 'https://api-gz.hosbbq.com/nus74f89st1/C.yml', interval: 86400, path: ./ruleset/ChinaMax.yml }
rules:
    - 'DOMAIN-SUFFIX,m4hs-9ekt-y2qb-fa7x-wl6r.sbs,DIRECT'
