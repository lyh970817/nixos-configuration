# # 1. ESSENTIAL: Set the internal terminal type to tmux-256color
# # This tells Yazi: "You are in tmux, please wrap your escape codes!"
# set -g default-terminal "tmux-256color"
#
# # 2. ENABLE PASSTHROUGH
# set -g allow-passthrough on

# # 3. FOCUS EVENTS (Helps with auto-updates)
set -g focus-events on

# # 4. TERMINAL OVERRIDES (The magic sauce)
# # We use * wildcard to ensure this applies to Alacritty (which might report as alacritty or xterm-256color)
# # Tc = TrueColor support
# # RGB = Red/Green/Blue color support
# set -ga terminal-overrides ",*:Tc"
# set -sa terminal-features ",*:RGB"

# 5. ENVIRONMENT
# set -ga update-environment TERM
# set -ga update-environment TERM_PROGRAM
# set -ga terminal-overrides ",alacritty:Tc"
# --- Pane Management ---
# Horizontal Split: Alt + Enter
bind -n M-Enter split-window -h -c "#{pane_current_path}"

# Enable extended keys so tmux recognizes the code sent by Alacritty
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Bind the specific escape code to your desired action
bind -n S-F12 split-window -v -c "#{pane_current_path}"

# Close Pane: Alt + q
bind -n M-q kill-pane

bind -n M-f resize-pane -Z

# --- Pane Navigation ---
# Use Alt + vim keys to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# # bind -n M# 1. Define a custom "User0" key for the code Alacritty sends (Alt+Shift+Enter)
# # \x1b corresponds to the Escape character
# set -s user-keys[0] "\x1b[13;4u"

# # 2. Bind that User0 key to the split action
# bind -n User0 split-window -v

# 1. Give the code "\x1b[13;4u" a nickname (User0)
# set -s user-keys[0] "\033[13;4u"

# 2. Bind the nickname "User0" to the command
# bind -n User0 kill-pane

set -g status off

set -g pane-border-lines heavy

set -g pane-border-status off

# Bind Alt+Shift+h/j/k/l to swap the current pane with the neighbor
# (Requires tmux 3.0 or higher for the '{left-of}' syntax)

bind -n M-H swap-pane -t '{left-of}' \; select-pane -t '{left-of}'
bind -n M-J swap-pane -t '{down-of}' \; select-pane -t '{down-of}'
bind -n M-K swap-pane -t '{up-of}'   \; select-pane -t '{up-of}'
bind -n M-L swap-pane -t '{right-of}' \; select-pane -t '{right-of}'

# Resize panes with Alt + Arrow keys
# (M represents the Alt/Meta key)
bind -n M-Left  resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up    resize-pane -U 2
bind -n M-Down  resize-pane -D 2

bind -n M-v copy-mode

# 1. Enable Mouse Support
set -g mouse on

# 2. Enable Vi-style keys for copy mode
set-window-option -g mode-keys vi

# 3. Key Bindings
# Bind 'v' to start selection (Vi style)
bind -T copy-mode-vi v send-keys -X begin-selection

# Bind 'y' to copy to Wayland clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# 4. Mouse Dragging
# When you release the mouse click after selecting, copy to clipboard automatically
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

