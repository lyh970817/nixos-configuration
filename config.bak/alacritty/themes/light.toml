# E-Ink Theme for Alacritty Terminal
# Pure black and white theme optimized for e-ink displays

[colors]
# Default colors
[colors.primary]
background = '#FFFFFF'  # Pure white background
foreground = '#000000'  # Pure black text

# Cursor colors
[colors.cursor]
text = '#FFFFFF'    # White text when cursor is over it
cursor = '#000000'  # Black cursor block

# Selection colors (inverted for visibility)
[colors.selection]
text = '#FFFFFF'
background = '#000000'

# Normal colors - all mapped to black/white for e-ink
[colors.normal]
black   = '#000000'
red     = '#000000'
green   = '#000000'
yellow  = '#000000'
blue    = '#000000'
magenta = '#000000'
cyan    = '#000000'
white   = '#FFFFFF'

# Bright colors - using same as normal for consistency
[colors.bright]
black   = '#808080'
red     = '#808080'
green   = '#808080'
yellow  = '#808080'
blue    = '#808080'
magenta = '#808080'
cyan    = '#808080'
white   = '#FFFFFF'

# Dim colors - using same as normal for e-ink
[colors.dim]
black   = '#000000'
red     = '#000000'
green   = '#000000'
yellow  = '#000000'
blue    = '#000000'
magenta = '#000000'
cyan    = '#000000'
white   = '#FFFFFF'

# Vi mode colors
[colors.vi_mode_cursor]
text = '#FFFFFF'
cursor = '#000000'

# Search colors
[colors.search]
[colors.search.matches]
foreground = '#FFFFFF'
background = '#000000'

[colors.search.focused_match]
foreground = '#000000'
background = '#FFFFFF'

# Line indicator colors
[colors.line_indicator]
foreground = '#000000'
background = '#FFFFFF'

# Footer bar (used in vi mode)
[colors.footer_bar]
foreground = '#000000'
background = '#FFFFFF'

# Optional: Window settings for better e-ink display
[window]

# Optional padding
padding.x = 10
padding.y = 10

# Decorations
decorations = "full"

# Optional: Font settings optimized for e-ink
[font]
# Size for good readability on e-ink
size = 11.0

# Normal font face - use a monospace font with good readability
normal.family = "Hack Nerd Font"
normal.style = "Regular"

# Bold font face
bold.family = "Hack Nerd Font"
bold.style = "Bold"

# Italic font face
italic.family = "Hack Nerd Font"
italic.style = "Italic"

# Bold italic font face
bold_italic.family = "Hack Nerd Font"
bold_italic.style = "Bold Italic"

# Optional: Cursor settings for e-ink
[cursor]
# Block cursor is most visible on e-ink
# style.shape = "Block"
# style.blinking = "Off"  # Blinking can be distracting on e-ink
# unfocused_hollow = true

# Optional: Selection settings
[selection]
save_to_clipboard = true

# Optional: Bell settings (visual bell for e-ink)
[bell]
# animation = "Linear"
# duration = 100
# color = '#000000'
